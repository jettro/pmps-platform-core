[tool.uv.workspace]
members = ["packages/*"]

# Released framework packages are the default. The explicit framework developer
# profile under dev/profiles is the opt-in source overlay.
[tool.uv.sources]
core-domain = { workspace = true }
core-services = { workspace = true }
framework-core = { index = "local" }
framework-infra = { index = "local" }

[[tool.uv.index]]
name     = "local"
url      = "http://localhost:8080/simple/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["packages"]
