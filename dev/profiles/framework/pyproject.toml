[project]
name = "core-framework-development"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "core-domain",
    "core-services",
    "framework-core",
    "framework-infra",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
core-domain = { path = "../../../packages/core-domain", editable = true }
core-services = { path = "../../../packages/core-services", editable = true }
framework-core = { path = "../../../../platform-framework/packages/framework-core", editable = true }
framework-infra = { path = "../../../../platform-framework/packages/framework-infra", editable = true }

[tool.pytest.ini_options]
testpaths = ["../../../packages"]
