[project]
name = "core-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "core-domain>=0.1,<1",
    "framework-core>=0.1,<1",
    "framework-infra>=0.1,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
# core-domain is in the same workspace — resolve it locally.
core-domain = { workspace = true }
# framework-core and framework-infra cross-repo overrides live in workspace root.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_services"]
