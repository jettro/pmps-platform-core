[project]
name = "core-domain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "framework-core>=0.1,<1",
]

# NOTE: No [tool.uv.sources] here.
# The cross-repo source override for framework-core lives in the workspace root
# pyproject.toml so it applies uniformly to every package in this workspace.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core_domain"]
